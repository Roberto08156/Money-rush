
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Money Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07130f;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:16px 8px;background:#10291d;border-bottom:2px solid #d7b64b}
h1{margin:0;color:#f6d75a;font-size:30px}
header p{margin:5px 0 0;color:#b9d5c2}
.stats{display:flex;justify-content:space-around;padding:12px;font-weight:bold;color:#f6d75a}
canvas{display:block;width:100%;max-width:440px;height:auto;margin:auto;background:#183d2a;touch-action:pan-y}
.controls{max-width:440px;margin:12px auto;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px}
button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:bold;background:#f6d75a;color:#152016}
#start{background:#24c875;color:#06190e}
.hint{color:#c1d5c8;font-size:13px;padding:0 12px 18px}
</style>
</head>
<body>
<header><h1>💰 MONEY RUSH</h1><p>¡Corre hacia tu fortuna!</p></header>
<div class="stats">
<div>🪙 Monedas: <span id="coins">0</span></div>
<div>🏆 Récord: <span id="best">0</span></div>
</div>
<canvas id="game" width="360" height="560"></canvas>
<div class="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️ SALTAR</button>
<button id="slide">⬇️ AGACHAR</button>
<button id="right">➡️</button>
</div>
<div class="controls"><button id="start">▶ JUGAR / REINICIAR</button></div>
<p class="hint">Desliza a izquierda o derecha para cambiar de carril. Salta las cajas y recoge monedas.</p>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best');
let lane=1,items=[],coins=0,best=0,running=false,over=false;
let frame=0,speed=3,jump=0,slide=0;
try{best=Number(localStorage.getItem('mrBest')||0)}catch(e){}
bestEl.textContent=best;
function reset(){
lane=1;items=[];coins=0;frame=0;speed=3;jump=0;slide=0;
running=true;over=false;coinsEl.textContent=coins;requestAnimationFrame(loop);
}
function move(n){if(!running)return;lane=Math.max(0,Math.min(2,lane+n))}
function actionJump(){if(running&&jump<=0&&slide<=0)jump=24}
function actionSlide(){if(running&&jump<=0)slide=22}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
document.getElementById('jump').onclick=actionJump;
document.getElementById('slide').onclick=actionSlide;
document.getElementById('start').onclick=reset;
let sx=0,sy=0;
c.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
c.addEventListener('touchend',e=>{
let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
else if(Math.abs(dy)>25){if(dy<0)actionJump();else actionSlide()}
},{passive:true});
document.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft')move(-1);
if(e.key==='ArrowRight')move(1);
if(e.key==='ArrowUp'||e.key===' ')actionJump();
if(e.key==='ArrowDown')actionSlide();
});
function text(t,x,y,size,color){ctx.fillStyle=color;ctx.font='bold '+size+'px Arial';ctx.textAlign='center';ctx.fillText(t,x,y)}
function draw(){
ctx.clearRect(0,0,360,560);
let g=ctx.createLinearGradient(0,0,0,560);g.addColorStop(0,'#285c3b');g.addColorStop(1,'#0a2117');ctx.fillStyle=g;ctx.fillRect(0,0,360,560);
ctx.fillStyle='#173b28';ctx.fillRect(35,0,290,560);
ctx.strokeStyle='#8aab88';ctx.lineWidth=2;ctx.setLineDash([18,16]);
ctx.beginPath();ctx.moveTo(132,0);ctx.lineTo(132,560);ctx.moveTo(228,0);ctx.lineTo(228,560);ctx.stroke();ctx.setLineDash([]);
text('🏦',65,55,27,'white');text('🏢',180,45,30,'white');text('🏙️',295,65,28,'white');
for(let it of items){
let x=[84,180,276][it.lane],y=it.y;
if(it.type==='coin'){text('🪙',x,y,25,'#fff')}
else if(it.type==='box'){text('📦',x,y,29,'white')}
else{text('💵',x,y,29,'white')}
}
let px=[84,180,276][lane],py=455-(jump>0?Math.sin((24-jump)/24*Math.PI)*65:0);
text(slide>0?'🛹':'🕴️',px,py,slide>0?31:35,'white');
ctx.fillStyle='#f5d75b';ctx.fillRect(px-19,py+12,38,5);
if(!running&&!over){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,180,360,140);text('¡MONEY RUSH!',180,225,27,'#f6d75a');text('Pulsa JUGAR para comenzar',180,265,15,'white')}
if(over){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,180,360,155);text('¡FIN DE LA CARRERA!',180,225,23,'#ffdf65');text('Monedas: '+coins,180,260,20,'white');text('Pulsa REINICIAR',180,295,16,'white')}
}
function loop(){
if(!running){draw();return}
frame++;
if(frame%43===0){
let r=Math.random(),type=r<.57?'coin':r<.8?'box':'bill';
items.push({lane:Math.floor(Math.random()*3),y:-15,type});
}
if(frame%600===0)speed=Math.min(7,speed+.3);
for(let it of items)it.y+=speed;
let px=[84,180,276][lane],py=455-(jump>0?Math.sin((24-jump)/24*Math.PI)*65:0);
for(let it of items){
if(it.lane===lane&&it.y>py-22&&it.y<py+22&&!it.hit){
if(it.type==='coin'||it.type==='bill'){
coins+=it.type==='coin'?1:5;coinsEl.textContent=coins;it.hit=true;
}else if(jump<=0&&slide<=0){running=false;over=true;
if(coins>best){best=coins;bestEl.textContent=best;
try{localStorage.setItem('mrBest',best)}catch(e){}}
}
}
}
items=items.filter(it=>it.y<590&&!it.hit);
if(jump>0)jump--;if(slide>0)slide--;
draw();
if(running)requestAnimationFrame(loop);
}
draw();
</script>
</body>
  </html>
